[project]
name = "qa-agent"
version = "0.1.0"
description = "面向高等数学学习问答的对话型 Agent（内部知识库 + 联网搜索），使用 aihub 中转站调用 LLM。"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Student QA Agent", email = "example@example.com" }]

dependencies = [
    "openai>=1.57.0",
    "httpx>=0.27.2",
    "pydantic>=2.9.2",
    "duckduckgo-search>=6.3.7",
    "rich>=13.9.4",
    "langfuse>=3.0.0",
    "python-dotenv>=1.0.0",
    "ddgs>=9.11.1",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
qa-agent-chat = "qa_agent.main:main"
qa-agent-web = "qa_agent.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.sources]

